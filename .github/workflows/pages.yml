name: Web preview artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web preview
        run: npm run build

      - name: Upload web preview
        uses: actions/upload-artifact@v4
        with:
          name: atlas-tools-web-preview
          path: dist
          if-no-files-found: error
          retention-days: 14
